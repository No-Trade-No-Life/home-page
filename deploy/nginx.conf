# Include inside an existing TLS-enabled server block for www.ntnl.io.
# Do not replace the current vhost before the migration is approved.
root /var/www/ntnl-website/dist;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
location / { try_files $uri $uri/ =404; }
location /assets/ { expires 1y; }
