name: PR checks
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Record preinstalled browser version
        run: google-chrome --version
      - run: npm run format:check
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
