<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面未找到 / Page not found — NTNL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #10110f;
        color: #f4f5ef;
        font:
          20px/1.8 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 760px);
      }
      .code {
        color: #cbff60;
        font-size: 18px;
        letter-spacing: 0.12em;
      }
      h1 {
        font-size: clamp(36px, 6vw, 72px);
        line-height: 1.2;
      }
      p {
        color: #c5c7c0;
      }
      a {
        display: inline-block;
        color: #cbff60;
        font-size: 20px;
        text-underline-offset: 6px;
      }
      a:focus-visible {
        outline: 2px solid #cbff60;
        outline-offset: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">NTNL / 404</p>
      <h1>页面未找到。<br /><span lang="en">Page not found.</span></h1>
      <p>这个地址暂时没有内容。你可以返回官网，继续探索我们的产品。</p>
      <p lang="en">
        There is no page at this address. Return to the website to explore our
        products.
      </p>
      <a href="/">返回官网 / Back to NTNL</a>
    </main>
  </body>
</html>
